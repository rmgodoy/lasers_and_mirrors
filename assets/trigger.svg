<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#ff4444" stroke-width="4" />
  <!-- Middle ring -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#ff4444" stroke-width="3" />
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="15" fill="none" stroke="#ff4444" stroke-width="2" />
  <!-- Crosshair lines -->
  <line x1="50" y1="2" x2="50" y2="98" stroke="#ff4444" stroke-width="2" />
  <line x1="2" y1="50" x2="98" y2="50" stroke="#ff4444" stroke-width="2" />
  <!-- Center dot -->
  <circle cx="50" cy="50" r="4" fill="#ff4444" />
</svg>
